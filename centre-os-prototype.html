<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Isha Karnataka (Prototype)</title>
<style>
  :root{
    --slate:#5b6a9e;        /* corner / priority roles */
    --slate-d:#46537f;
    --mid:#7a93c4;          /* mid roles */
    --teal:#a9d6d6;         /* inner roles */
    --teal-d:#7cb8b8;
    --ink:#1f2433;
    --muted:#6b7280;
    --line:#e6e8ef;
    --bg:#f5f6fb;
    --card:#ffffff;
    --good:#2f9e6f;
    --warn:#e0a106;
    --pend:#cfd4e3;
    --shadow:0 1px 3px rgba(31,36,51,.08),0 8px 24px rgba(31,36,51,.06);
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px 80px}

  /* top bar */
  header.top{position:sticky;top:0;z-index:30;background:rgba(245,246,251,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top-inner{max-width:1180px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px}
  .logo{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.4px;font-size:26px;line-height:1.1}
  .logo .mk{width:34px;height:34px}
  .nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .nav button{border:1px solid var(--line);background:var(--card);padding:8px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
  .nav button.active{background:var(--slate);border-color:var(--slate);color:#fff}

  /* breadcrumb */
  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:22px 0 6px}
  .crumbs b{color:var(--ink)}
  .crumbs .c{cursor:pointer}
  .crumbs .c:hover{color:var(--slate);text-decoration:underline}

  h1{font-size:26px;margin:8px 0 2px;letter-spacing:-.5px}
  h2{font-size:19px;margin:30px 0 12px;letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 8px}

  /* dashboard */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 8px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .n{font-size:30px;font-weight:800;letter-spacing:-1px}
  .kpi .l{font-size:12.5px;color:var(--muted);margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .kpi small{color:var(--muted);font-weight:600}
  .bar{height:8px;border-radius:6px;background:var(--pend);overflow:hidden;margin-top:12px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-d),var(--slate));border-radius:6px}

  .stage-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:6px}
  .stage-pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stage-pill .n{font-size:22px;font-weight:800}
  .stage-pill .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-top:2px}

  /* cards grid */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:transform .12s ease,box-shadow .12s ease;position:relative}
  .card.click{cursor:pointer}
  .card.click:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(31,36,51,.12),0 18px 40px rgba(31,36,51,.10)}
  .card h3{margin:2px 0 4px;font-size:17px}
  .card .meta{font-size:13px;color:var(--muted)}
  .card .foot{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}

  .tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.3px}
  .tag.micro{background:#eef0fa;color:#5b6a9e}
  .tag.sub{background:#e7eefb;color:#3f6dc0}
  .tag.centre{background:#e3f4f1;color:#2f9e6f}
  .tag.super{background:#f3ecfb;color:#7c4dbd}
  .tag.sector{background:#fdeede;color:#c07b16}
  .tag.region{background:#eef0fa;color:#46537f}

  .mini-prog{flex:1;min-width:80px}
  .mini-prog .bar{margin-top:0}
  .mini-prog .lbl{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between}

  .addcard{border:1.5px dashed #c4cadd;background:transparent;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--slate);font-weight:700;min-height:120px;border-radius:var(--radius)}
  .addcard:hover{background:#fff;border-color:var(--slate)}

  /* buttons */
  .btn{border:1px solid var(--slate);background:var(--slate);color:#fff;padding:9px 15px;border-radius:10px;font-weight:700;font-size:13.5px}
  .btn:hover{background:var(--slate-d)}
  .btn.ghost{background:#fff;color:var(--slate)}
  .btn.ghost:hover{background:#f3f5fc}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
  .btn.danger{border-color:#e3b1b1;color:#b14040;background:#fff}
  .btn.danger:hover{background:#fcefef}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  /* layout: centre detail */
  .split{display:grid;grid-template-columns:1.05fr 1fr;gap:26px;align-items:start;margin-top:10px}
  @media (max-width:880px){.split{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}}
  @media (max-width:560px){.grid,.kpis,.stage-strip{grid-template-columns:1fr}}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .panel h3{margin:0 0 4px;font-size:16px}
  .panel .hint{font-size:12.5px;color:var(--muted);margin:0 0 14px}

  /* triangle */
  .tri-wrap{display:flex;flex-direction:column;align-items:center}
  svg.tri{width:100%;max-width:420px;height:auto;overflow:visible}
  .tri polygon{stroke:#fff;stroke-width:3;cursor:pointer;transition:opacity .15s,filter .15s}
  .tri polygon:hover{filter:brightness(1.06)}
  .tri text{font-size:10.5px;font-weight:800;fill:#1f2433;pointer-events:none;text-anchor:middle;letter-spacing:.2px}
  .tri text.lite{fill:#aeb4c6}
  .tri text.reg-lbl{fill:#fff;font-size:10.5px;font-weight:800;letter-spacing:.4px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:14px;font-size:12px;color:var(--muted)}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

  /* classify selector */
  .stages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:6px}
  .stage-opt{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:10px 6px;text-align:center;font-weight:700;font-size:12.5px;color:var(--muted)}
  .stage-opt small{display:block;font-weight:600;font-size:10px;margin-top:3px;color:#9aa1b5}
  .stage-opt.on{border-color:var(--slate);background:#eef1fb;color:var(--slate)}
  .stage-opt:hover{border-color:var(--slate)}

  /* role list */
  .role-list{display:flex;flex-direction:column;gap:9px}
  .role{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fff}
  .role .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .role .nm{font-weight:700;font-size:14px}
  .role .who{font-size:12.5px;color:var(--muted)}
  .role .right{margin-left:auto;display:flex;gap:7px;align-items:center}
  .pri{font-size:9.5px;font-weight:800;letter-spacing:.4px;padding:3px 7px;border-radius:6px;text-transform:uppercase}
  .pri.p{background:#fdeede;color:#c07b16}
  .pri.n{background:#eef0fa;color:#5b6a9e}
  .role.future{opacity:.5}
  .chip-assigned{font-size:12px;font-weight:700;color:var(--good)}
  .chip-pending{font-size:12px;font-weight:700;color:var(--warn)}

  /* children list */
  .child{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:#fff;cursor:pointer}
  .child:hover{border-color:var(--slate);background:#fafbff}
  .child .nm{font-weight:700}
  .child .right{margin-left:auto;display:flex;align-items:center;gap:8px}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(20,24,38,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
  .scrim.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:540px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
  .modal .mh{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal .mh h3{margin:0;font-size:18px}
  .modal .mb{padding:20px 22px}
  .modal .mf{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#fafbff;border-radius:0 0 16px 16px}
  label.fld{display:block;margin:0 0 12px}
  label.fld span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--slate)}
  .x{margin-left:auto;border:none;background:#f0f1f6;width:30px;height:30px;border-radius:8px;font-size:16px;color:var(--muted)}

  /* role detail / toolkit */
  .resp{display:flex;flex-direction:column;gap:9px;margin:6px 0 0}
  .resp .it{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
  .resp .it b{color:var(--slate);font-weight:800}
  .kv{display:flex;gap:8px;font-size:13.5px;margin:7px 0}
  .kv .k{color:var(--muted);font-weight:700;min-width:120px}
  .toolkit{background:#f3f5fc;border:1px solid #e2e7f5;border-radius:11px;padding:14px;margin-top:10px}
  .toolkit a{color:var(--slate);font-weight:700;text-decoration:none}
  .toolkit a:hover{text-decoration:underline}
  .banner{background:linear-gradient(120deg,#eef1fb,#e7f4f1);border:1px solid #e2e7f5;border-radius:var(--radius);padding:18px 20px;margin:18px 0}
  .banner b{color:var(--slate)}
  .note{font-size:12.5px;color:var(--muted);background:#fff8e9;border:1px solid #f3e3bd;padding:10px 12px;border-radius:10px;margin-top:12px}
  .empty{color:var(--muted);font-size:14px;padding:18px;border:1.5px dashed var(--line);border-radius:12px;text-align:center}
  .people{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:680px){.people{grid-template-columns:1fr 1fr}}
  .person{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
  .person .av{width:38px;height:38px;border-radius:50%;background:var(--slate);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .person .nm{font-weight:700;margin-top:8px}
  .person .rl{font-size:12.5px;color:var(--muted)}
  .person .loc{font-size:11.5px;color:#9aa1b5;margin-top:3px}
  footer.ft{color:#9aa1b5;font-size:12px;text-align:center;margin-top:40px}

  /* auth gate */
  .gate{position:fixed;inset:0;z-index:80;background:linear-gradient(160deg,#eef1fb,#e7f4f1);display:flex;align-items:center;justify-content:center;padding:20px}
  .gatecard{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(31,36,51,.18);width:100%;max-width:380px;padding:30px 28px;text-align:center}
  .gatecard .glogo{display:flex;justify-content:center}
  .gatecard h2{font-size:22px;letter-spacing:-.4px;margin:6px 0 2px}
  .gsub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
  .gatecard .fld{text-align:left}
  .gerr{color:#b14040;font-size:12.5px;min-height:18px;margin:2px 0 8px;text-align:left;line-height:1.5}
  .grow{margin-top:14px;font-size:12.5px}
  .grow a{color:var(--slate);font-weight:700;cursor:pointer}
  .grow a:hover{text-decoration:underline}
  #whoami{font-size:12.5px;color:var(--muted);font-weight:700;align-self:center;margin-left:4px}
  #syncDot{font-size:11.5px;font-weight:700;align-self:center;margin-left:2px}
  #logoutBtn{color:#b14040 !important;border-color:#e3b1b1 !important}

  /* region panel on home */
  .region-panel{background:linear-gradient(140deg,#f8faff,#f0f7f6);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-top:8px}
  .region-panel .rp-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:24px;align-items:center}
  @media (max-width:880px){.region-panel .rp-grid{grid-template-columns:1fr}}
  .region-panel .rp-blurb{font-size:13.5px;color:var(--muted);line-height:1.55}
  .region-panel .rp-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
  .region-panel .rp-stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .region-panel .rp-stat .n{font-size:20px;font-weight:800;letter-spacing:-.5px}
  .region-panel .rp-stat .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}

  /* group headings on sector grid */
  .group-head{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
  .group-head h2{margin:0}
  .group-head .gline{flex:1;height:1px;background:var(--line)}
  .group-head .gcount{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}

  /* sub-role fractal */
  .sub-fractal{margin-top:10px}
  .sub-fractal svg.mini-tri{display:block;margin:8px auto;max-width:320px;width:100%}
  .sub-fractal svg.mini-tri polygon{cursor:pointer;transition:opacity .15s,filter .15s}
  .sub-fractal svg.mini-tri polygon:hover{filter:brightness(1.08)}
  .sub-fractal svg.mini-tri text{font-size:9.5px;font-weight:800;fill:#fff;pointer-events:none;text-anchor:middle;letter-spacing:.2px}
  .sub-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
  @media (max-width:520px){.sub-grid{grid-template-columns:1fr}}
  .sub-chip{border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:10px;text-align:left;cursor:pointer;font-family:inherit;transition:border-color .12s,background .12s}
  .sub-chip:hover{border-color:var(--slate);background:#fafbff}
  .sub-chip .nm{font-weight:700;font-size:13.5px}
  .sub-chip .desc{font-size:12px;color:var(--muted);margin-top:2px}

  /* coordinator card (sector / centre extra slots) */
  .coord-card{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .12s,background .12s}
  .coord-card:hover{border-color:var(--slate);background:#fafbff}
  .coord-card .av{width:42px;height:42px;border-radius:50%;background:#eef0fa;color:var(--slate);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
  .coord-card.assigned .av{background:var(--good);color:#fff}
  .coord-card .body{flex:1;min-width:0}
  .coord-card .lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .coord-card .nm{font-weight:700;font-size:14.5px;margin-top:2px}
  .coord-card .meta{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .coord-card .arr{color:#c4cadd;font-size:18px;flex:none}
  .coord-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  @media (max-width:560px){.coord-row{grid-template-columns:1fr}}

  /* profile form sections in modal */
  .profile-section{margin-top:18px}
  .profile-section .ps-head{font-weight:800;font-size:13px;margin-bottom:6px}
  .profile-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:520px){.profile-row{grid-template-columns:1fr}}
  textarea{min-height:60px;resize:vertical;font-family:inherit}

  /* enhanced person card on People page */
  .person .extra{font-size:11.5px;color:var(--muted);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;line-height:1.45}
  .person .extra b{color:var(--ink);font-weight:700}

  /* admin user table */
  table.admin-table{width:100%;border-collapse:collapse;font-size:13.5px}
  table.admin-table th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:12px 14px;border-bottom:1px solid var(--line);background:#fafbff}
  table.admin-table td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.admin-table tr:last-child td{border-bottom:none}
  .badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.4px;padding:3px 8px;border-radius:6px;text-transform:uppercase}
  .badge.bp{background:#fdeede;color:#c07b16}
  .badge.ba{background:#e3f4f1;color:#2f9e6f}
  .badge.bd{background:#fbeaea;color:#b14040}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="logo">
      <svg class="mk" viewBox="0 0 100 90"><polygon points="50,4 96,86 4,86" fill="#5b6a9e"/><polygon points="50,4 73,45 27,45" fill="#a9d6d6"/></svg>
      Isha Karnataka
    </div>
    <nav class="nav" id="nav">
      <button data-view="home" class="active">Region & Dashboard</button>
      <button data-view="roles">Roles &amp; Responsibilities</button>
      <button data-view="people">People</button>
      <button data-view="admin" id="adminNavBtn" style="display:none">Admin</button>
      <span id="syncDot" style="display:none">●</span>
      <span id="whoami" style="display:none"></span>
      <button id="logoutBtn" style="display:none">Log out</button>
    </nav>
  </div>
</header>

<div class="gate" id="gate"><div class="gatecard" id="gatecard"></div></div>

<div class="wrap" id="app"></div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>

<footer class="ft">Isha Karnataka · interactive prototype · data lives in your browser session — edit freely</footer>

<script>
/* =========================================================================
   ROLE LIBRARY  (names from your model; responsibilities/POC/toolkit are
   editable placeholders — correct them once you see them live)
   ========================================================================= */
const PRIORITY_BY_STAGE = {
  micro:  ['nurturing'],
  sub:    ['nurturing','programs','promotions'],
  centre: ['nurturing','relations','registration','communication','programs','temple','finance','biksha','promotions'],
  sector: []
};
const PRIORITY = ['nurturing','programs','promotions']; // legacy

const ROLES = {
  nurturing:  { name:'Nurturing',   color:'#5b6a9e', priority:true,
    blurb:'The heart of the centre — cares for every member and keeps people connected.',
    resp:['Welcome & onboard new members','Run regular check-ins and follow-ups','Track attendance & wellbeing','Escalate member needs to the Coordinator'],
    poc:'Centre Coordinator', tool:'ClickUp — Attendance & Care board', link:'https://app.clickup.com/' },
  programs:   { name:'Programs',    color:'#5b6a9e', priority:true,
    blurb:'Plans and runs the activities that bring the centre to life.',
    resp:['Design the weekly / monthly program calendar','Coordinate facilitators & speakers','Own logistics for each session','Collect feedback and improve'],
    poc:'Centre Coordinator', tool:'ClickUp — Calendar Planning board', link:'https://app.clickup.com/' },
  promotions: { name:'Promotions',  color:'#5b6a9e', priority:true,
    blurb:'Grows reach and visibility so more people find the centre.',
    resp:['Promote programs locally & online','Run WhatsApp / social outreach','Create flyers & creatives','Drive new registrations'],
    poc:'Centre Coordinator', tool:'ClickUp — Outreach board / Canva', link:'https://app.clickup.com/' },
  relations:  { name:'Relations',   color:'#7a93c4', priority:false,
    blurb:'Builds partnerships and keeps the community fabric strong.',
    resp:['Liaise with RWAs, local bodies & partners','Manage volunteer relationships','Resolve conflicts & gather goodwill'],
    poc:'Centre Coordinator', tool:'ClickUp — Partnerships board', link:'https://app.clickup.com/' },
  registration:{ name:'Registration + Database', color:'#7a93c4', priority:false,
    blurb:'Owns sign-ups, clean entry of every participant, and maintains the registration database.',
    resp:['Manage event & program registrations','Maintain participant lists','Maintain registration records and database','Coordinate closely with Communication'],
    poc:'Centre Coordinator', tool:'ClickUp — Registration forms', link:'https://app.clickup.com/' },
  communication:{ name:'Communication', color:'#a9d6d6', priority:false,
    blurb:'Manages member communication and keeps the community connected.',

let UID = 1; const nid = () => 'n'+(UID++);
function node(name, kind, stage, assign, children){
  return {id:nid(), name, kind, stage, assign:assign||{}, children:children||[]};
}

/* centre entry: a plain string, or {n, stage, assign} for richer setup */
function mk(c){
  if(typeof c==='string') return node(c,'place','centre',{},[]);
  return node(c.n,'place',c.stage||'centre',c.assign||{},[]);
}
function sec(name, centres, taluks){
  const kids=centres.map(mk);
  if(taluks) taluks.forEach(t=>kids.push(node(t,'place','sub',{},[])));
  return node(name,'sector','sector',{},kids);
}

/* ---- tree helpers ---- */
function find(id, root=STATE){ if(root.id===id) return root; for(const c of root.children){ const f=find(id,c); if(f) return f; } return null; }
function parentOf(id, root=STATE){ for(const c of root.children){ if(c.id===id) return root; const p=parentOf(id,c); if(p) return p; } return null; }
function nodeByPath(){ return PATH.length? find(PATH[PATH.length-1]) : STATE; }

function requiredRoles(n){ return STAGE_ROLES[n.stage]||[]; }
function priorityRequired(n){ return (PRIORITY_BY_STAGE[n.stage]||PRIORITY).filter(r=>requiredRoles(n).includes(r)); }
function assignedCount(n, roleSet){ return roleSet.filter(r=>n.assign[r]).length; }

/* walk all "place" nodes (centres/sub/micro/super + promoted sectors) */
function allPlaces(root=STATE, acc=[]){ for(const c of root.children){ if(c.kind==='place') acc.push(c); allPlaces(c,acc); } return acc; }
function allSectors(){ return STATE.children.filter(c=>c.kind==='sector'); }

/* dashboard metrics: PRIORITY roles only */
function metrics(){
  const places = allPlaces();
  let need=0, got=0;
  const byStage={micro:0,sub:0,centre:0,super:0,sector:0};
  places.forEach(p=>{
    if(byStage[p.stage]!==undefined) byStage[p.stage]++;
    const pr = priorityRequired(p);
    need += pr.length; got += assignedCount(p,pr);
  });
  // sectors created at region level
  const sectorCount = allSectors().length + places.filter(p=>p.stage==='sector').length;
  byStage.sector = sectorCount;
  return {places:places.length, need, got, pending:need-got,
          pct: need? Math.round(got/need*100):0, byStage};
}

/* people roster derived from assignments */
/* ---------- person value helpers (back-compat: assign[r] may be a string or {name,mobile,profession}) ---------- */
function personName(p){ if(!p) return ''; if(typeof p==='string') return p; return p.name||''; }
function personMobile(p){ if(!p||typeof p==='string') return ''; return p.mobile||''; }
function personProfession(p){ if(!p||typeof p==='string') return ''; return p.profession||''; }
function personHas(p){ return !!personName(p); }
function roster(){
  const out=[];
  // region-level roles
  if(STATE.assign){
    Object.entries(STATE.assign).forEach(([roleKey, person])=>{
      if(personHas(person)){
        const meta = REGION_ROLES[roleKey];
        if(meta) out.push({person, roleLabel:meta.name, color:meta.color, priority:meta.priority, scope:'Region', place:'Karnataka'});
      }
    });
  }
  // sector-level roles
  allSectors().forEach(s=>{
    if(!s.assign) return;
    SECTOR_SLOTS.forEach(slot=>{
      const person=s.assign[slot];
      if(personHas(person)){
        const meta=SECTOR_SLOT_META[slot];
        out.push({person, roleLabel:meta.name, color:meta.color, priority:true, scope:'Sector', place:s.name});
      }
    });
  });
  // centre-level: triangle roles + centre-extra coordinator
  allPlaces().forEach(p=>{
    Object.entries(p.assign||{}).forEach(([key,person])=>{
      if(!personHas(person)) return;
      if(key.startsWith('centre_')){
        const slot=key.replace('centre_','');
        const meta=CENTRE_EXTRA_META[slot]; if(!meta) return;
        out.push({person, roleLabel:meta.name, color:meta.color, priority:true, scope:STAGE_META[p.stage].label, place:p.name});
      } else if(ROLES[key]){
        const meta=ROLES[key];
        out.push({person, roleLabel:meta.name, color:meta.color, priority:meta.priority, scope:STAGE_META[p.stage].label, place:p.name});
      }
    });
  });
  return out;
}

  h+= renderGroup('Bangalore sectors', bangalore, false);

}

/* region triangle: 9 distinct roles. Cell colour follows assignment state.
   Priority roles (corners) use slate; mid roles use mid-blue; teal cells
   (Outreach / Isha Business / Admin) form the inner support layer. */
function regionTriangleSVG(){
  let h='<svg class="tri" viewBox="-6 -6 312 272">';
  ROLE_ORDER.forEach(slot=>{
    const roleKey = REGION_SLOT_MAP[slot];
    const role = REGION_ROLES[roleKey];
    const who = personName(STATE.assign && STATE.assign[roleKey]);
    // Show role colour even when unassigned, so the triangle matches the brand image
    const fill = role.color;
    const opacity = who ? 1 : 0.78;
    h+=`<polygon points="${TRI[slot]}" fill="${fill}" opacity="${opacity}" onclick='openRegionRole("${roleKey}")'>
      <title>${role.name}${who?' — '+who:' — pending'}</title>
    </polygon>`;
  });
  ROLE_ORDER.forEach(slot=>{
    const roleKey = REGION_SLOT_MAP[slot];
    const role = REGION_ROLES[roleKey];
    const [x,y] = TRI_LABEL[slot];
    h+= regionTriLabel(role.name, x, y);
  });
  h+='</svg>';
  return h;
}
/* Label helper: white text, splits on space for 2-word labels longer than 10 chars
   (e.g. "ISHA BUSINESS" → two lines), so labels fit inside the cell. */
function regionTriLabel(name, x, y){
  const upper = name.toUpperCase();
  const cls = 'reg-lbl';
  if(upper.length <= 10){
    return `<text x="${x}" y="${y}" class="${cls}">${upper}</text>`;
  }
  const sp = upper.indexOf(' ');
  if(sp > 0 && sp < upper.length-1){
    return `<text x="${x}" y="${y-4}" class="${cls}">${upper.slice(0,sp)}</text>` +
           `<text x="${x}" y="${y+8}" class="${cls}">${upper.slice(sp+1)}</text>`;
  }
  return `<text x="${x}" y="${y}" class="${cls}">${upper.slice(0,9)}…</text>`;
}

function regionMetrics(){
  const need = REGION_ROLE_ORDER.length;
  let got = 0;
  REGION_ROLE_ORDER.forEach(rk=>{ if(personHas(STATE.assign && STATE.assign[rk])) got++; });
  return {need, got};
}

/* generic coordinator card used at sector & centre level */

  const who = personName(personObj);

function placeCard(p){
  const meta=STAGE_META[p.stage]; const pr=progFor(p);

  return `<div class="card click" onclick='go("place",${JSON.stringify(currentPathTo(p.id))})'>

/* build a PATH array down to a node id */
function currentPathTo(id){
  const chain=[]; let cur=find(id);
  while(cur && cur.id!==STATE.id){ chain.unshift(cur.id); cur=parentOf(cur.id); }
  return chain;
}

/* ---------- ADMIN page (admin only): approve / reject sign-ups ---------- */
let ADMIN_USERS = null; // cached user list from backend
async function renderAdmin(){
  if(!IS_ADMIN){
    app.innerHTML = `<h1>Admin</h1><div class="empty">You do not have admin access.</div>`;
    return;
  }
  app.innerHTML = `<h1>Admin · User access</h1>
    <p class="sub">Approve new sign-ups and manage existing accounts. Pending users can't log in until you approve them.</p>
    <div id="adminBody"><div class="empty">Loading users…</div></div>`;
  try{
    const r = await api('list_users', {token:TOKEN});
    if(!r || !r.ok){
      document.getElementById('adminBody').innerHTML =
        `<div class="empty" style="color:#b14040">Couldn't load users: ${r&&r.error?r.error:'unknown error'}</div>`;
      return;
    }
    ADMIN_USERS = r.users || [];
    paintAdmin();
  } catch(e){
    document.getElementById('adminBody').innerHTML =
      `<div class="empty" style="color:#b14040">Network error reaching the backend.</div>`;
  }
}
function paintAdmin(){
  const body = document.getElementById('adminBody'); if(!body) return;
  const users = ADMIN_USERS || [];
  const pending  = users.filter(u=>u.active==='pending');
  const approved = users.filter(u=>u.active==='yes' || u.active==='true' || u.active==='');
  const disabled = users.filter(u=>u.active==='no' || u.active==='false' || u.active==='disabled');
  let h = '';
  // Pending
  h += `<div class="group-head" style="margin-top:6px"><h2>Pending approval</h2><div class="gline"></div><span class="gcount">${pending.length}</span></div>`;
  if(pending.length===0){
    h += `<div class="empty">No accounts waiting — you're all caught up.</div>`;
  } else {
    h += `<div class="panel" style="padding:0">${userTable(pending, true)}</div>`;
  }
  // Approved
  h += `<div class="group-head"><h2>Approved</h2><div class="gline"></div><span class="gcount">${approved.length}</span></div>`;
  h += approved.length ? `<div class="panel" style="padding:0">${userTable(approved, false)}</div>` : `<div class="empty">No approved accounts yet.</div>`;
  // Disabled
  if(disabled.length){
    h += `<div class="group-head"><h2>Disabled</h2><div class="gline"></div><span class="gcount">${disabled.length}</span></div>`;
    h += `<div class="panel" style="padding:0">${userTable(disabled, false)}</div>`;
  }
  body.innerHTML = h;
}
function userTable(users, isPending){
  let h = `<table class="admin-table"><thead><tr><th>Username</th><th>Full name</th><th>Status</th><th style="text-align:right">Action</th></tr></thead><tbody>`;
  users.forEach(u=>{
    const isAdminRow = (u.username||'').toLowerCase()==='admin';
    let statusBadge;
    if(u.active==='pending') statusBadge = `<span class="badge bp">Pending</span>`;
    else if(u.active==='no' || u.active==='false' || u.active==='disabled') statusBadge = `<span class="badge bd">Disabled</span>`;
    else statusBadge = `<span class="badge ba">Active</span>`;
    let actions = '';
    if(isAdminRow){
      actions = `<span class="meta" style="color:var(--muted);font-size:12px">protected</span>`;
    } else if(u.active==='pending'){
      actions = `<button class="btn sm" onclick='adminApprove("${esc(u.username)}")'>Approve</button>
                 <button class="btn sm danger" style="margin-left:6px" onclick='adminReject("${esc(u.username)}")'>Reject</button>`;
    } else if(u.active==='no' || u.active==='false' || u.active==='disabled'){
      actions = `<button class="btn sm" onclick='adminApprove("${esc(u.username)}")'>Re-enable</button>`;
    } else {
      actions = `<button class="btn sm danger" onclick='adminReject("${esc(u.username)}")'>Disable</button>`;
    }
    h += `<tr><td><b>${u.username}</b></td><td>${u.name||''}</td><td>${statusBadge}</td><td style="text-align:right">${actions}</td></tr>`;
  });
  h += `</tbody></table>`;
  return h;
}
async function adminApprove(username){
  try{
    const r = await api('approve_user', {token:TOKEN, username});
    if(r&&r.ok){ updateAdminCache(username, 'yes'); paintAdmin(); }
    else alert((r&&r.error)||'Failed to approve.');
  } catch(e){ alert('Network error.'); }
}
async function adminReject(username){
  if(!confirm(`Reject / disable "${username}"? They will not be able to log in.`)) return;
  try{
    const r = await api('reject_user', {token:TOKEN, username});
    if(r&&r.ok){ updateAdminCache(username, 'no'); paintAdmin(); }
    else alert((r&&r.error)||'Failed to reject.');
  } catch(e){ alert('Network error.'); }
}
function updateAdminCache(username, active){
  if(!ADMIN_USERS) return;
  const target = (username||'').toLowerCase();
  ADMIN_USERS.forEach(u=>{ if((u.username||'').toLowerCase()===target) u.active = active; });
}

/* =========================================================================

   ========================================================================= */
function go(view, path){ VIEW=view; PATH=path||[]; window.scrollTo(0,0); render(); }
document.querySelectorAll('#nav button[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view, []));

function setStage(id, stage){ const n=find(id); n.stage=stage; render(); }
function removeNode(id){ const removeFrom=(arr)=>{ for(let i=0;i<arr.length;i++){ if(arr[i].id===id){ arr.splice(i,1); return true; } if(arr[i].children && removeFrom(arr[i].children)) return true; } return false; }; removeFrom(STATE.children); render(); }

function addPlace(parentId){
  const p=find(parentId);
  const isSector = p.stage==='sector';
  // Restrict child stage options by parent stage
  let allowedStages;
  if(p.stage==='centre') allowedStages = ['micro','sub'];
  else if(p.stage==='sub') allowedStages = ['micro'];
  else allowedStages = STAGE_SEQ;
  const opts = allowedStages.map(s=>`<option value="${s}">${STAGE_META[s].label} — ${STAGE_META[s].need}</option>`).join('');
  modalForm(isSector?`Add a centre under ${p.name}`:`Map a cluster under ${p.name}`,[
    {k:'name',label:isSector?'Centre name':'Cluster (sub-area) name',ph:'e.g. Begur'},
    {k:'stage',label:'Classify as',select:opts,val:'centre'}
  ],(v)=>{
    if(!v.name) return;
    p.children.push(node(v.name,'place',v.stage||'centre',{},[]));
    render();
  });
}

/* =========================================================================
   Sub-role fractal — a mini triangle (or grid) shown inside a role modal
   ========================================================================= */
function subRoleFractal(roleKey, color){
  const r = REGION_ROLES[roleKey] || ROLES[roleKey];
  const subs = (r && r.sub) || [];
  if(!subs.length) return '';
  let h = '<div class="sub-fractal">';
  if(subs.length === 3){
    // 3 inner triangles forming a fractal
    h += '<svg viewBox="-6 -6 232 192" class="mini-tri">';
    const tris = [
      {pts:'110,0 65,78 155,78',  l:[110,42]},
      {pts:'20,170 65,92 110,170', l:[65,148]},
      {pts:'110,170 155,92 200,170', l:[155,148]}
    ];
    subs.forEach((s,i)=>{
      const sub = SUB_ROLES[s] || {name:s};
      const t = tris[i];
      h += `<polygon points="${t.pts}" fill="${color}" opacity="0.9" stroke="#fff" stroke-width="2" onclick='openSubRole("${s}","${roleKey}")'>
              <title>${sub.name}</title></polygon>`;
      h += `<text x="${t.l[0]}" y="${t.l[1]}">${sub.name}</text>`;
    });
    h += '</svg>';
  } else if(subs.length === 4){
    // 4-cell fractal: one apex + 3 base cells (like Sierpinski step)
    h += '<svg viewBox="-6 -6 232 202" class="mini-tri">';
    const tris = [
      {pts:'110,0 65,78 155,78',   l:[110,42]},   // apex
      {pts:'20,170 65,92 110,170', l:[65,148]},   // left base
      {pts:'110,170 155,92 200,170', l:[155,148]},// right base
      {pts:'65,78 155,78 110,170', l:[110,116]}   // centre (inverted)
    ];
    subs.forEach((s,i)=>{
      const sub = SUB_ROLES[s] || {name:s};
      const t = tris[i];
      const opacity = i===3 ? 0.65 : 0.9;
      h += `<polygon points="${t.pts}" fill="${color}" opacity="${opacity}" stroke="#fff" stroke-width="2" onclick='openSubRole("${s}","${roleKey}")'>
              <title>${sub.name}</title></polygon>`;
      h += `<text x="${t.l[0]}" y="${t.l[1]}">${sub.name}</text>`;
    });
    h += '</svg>';
  } else {
    // fallback grid
    h += '<div class="sub-grid">';
    subs.forEach(s=>{
      const sub = SUB_ROLES[s] || {name:s, resp:[]};
      h += `<button class="sub-chip" onclick='openSubRole("${s}","${roleKey}")'>
              <div class="nm" style="color:${color}">${sub.name}</div>
              <div class="desc">${(sub.resp&&sub.resp[0])||'Sub-team'}</div></button>`;
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function openSubRole(subKey, parentRoleKey){
  const sub = SUB_ROLES[subKey] || {name:subKey, resp:[]};
  const parent = REGION_ROLES[parentRoleKey] || ROLES[parentRoleKey];
  const body = `

      <span class="pri n">Sub-team of ${parent.name}</span>

function saveCentreSlot(placeId, slot){
  const n=find(placeId); if(!n.assign) n.assign={};
  const v=gatherProfile(); const key='centre_'+slot;
  if(v.name){ n.assign[key]=v; } else { delete n.assign[key]; }
  closeModal(); render();
}
function clearCentreSlot(placeId, slot){ const n=find(placeId); if(n.assign) delete n.assign['centre_'+slot]; closeModal(); render(); }

/* =========================================================================
   MODAL plumbing
   ========================================================================= */
const scrim=document.getElementById('scrim'), modal=document.getElementById('modal');
function showModal(title, bodyHTML, footHTML, color){
  modal.innerHTML=`<div class="mh"><span style="width:14px;height:14px;border-radius:4px;background:${color||'var(--slate)'}"></span>
    <h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="mb">${bodyHTML}</div><div class="mf">${footHTML}</div>`;
  scrim.classList.add('show');
}
function closeModal(){ scrim.classList.remove('show'); }
scrim.addEventListener('click',e=>{ if(e.target===scrim) closeModal(); });

function modalForm(title, fields, onSave){
  const body=fields.map(f=>{
    if(f.select) return `<label class="fld"><span>${f.label}</span><select id="f_${f.k}">${f.select}</select></label>`;
    return `<label class="fld"><span>${f.label}</span><input id="f_${f.k}" placeholder="${f.ph||''}" value="${f.val||''}"/></label>`;
  }).join('');
  showModal(title, body, `<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="mSave">Save</button>`);
  fields.forEach(f=>{ if(f.val&&$('#f_'+f.k)) $('#f_'+f.k).value=f.val; });
  $('#mSave').onclick=()=>{ const v={}; fields.forEach(f=>v[f.k]=$('#f_'+f.k).value.trim()); closeModal(); onSave(v); };
}

/* =========================================================================
   BACKEND (Google Apps Script web app) + PER-USER AUTH
   ========================================================================= */
const DEFAULT_API_URL='https://script.google.com/macros/s/AKfycbyMXFEs9PSB2M4whA73dEqChsf_4hJNoOIk8FXrCRjZdLSZOxkwfRr32C0jJ86RAE4S/exec'; let API_URL=DEFAULT_API_URL, TOKEN='', UNAME='', IS_ADMIN=false;

try{ API_URL=localStorage.getItem('isha_api')||DEFAULT_API_URL; TOKEN=localStorage.getItem('isha_token')||''; UNAME=localStorage.getItem('isha_name')||''; IS_ADMIN=localStorage.getItem('isha_admin')==='1'; }catch(e){}

const gate=document.getElementById('gate'), gatecard=document.getElementById('gatecard');
function showGate(html){ gatecard.innerHTML=html; gate.style.display='flex'; }
function hideGate(){ gate.style.display='none'; }
const LOGO='<svg viewBox="0 0 100 90" width="34"><polygon points="50,4 96,86 4,86" fill="#5b6a9e"/><polygon points="50,4 73,45 27,45" fill="#a9d6d6"/></svg>';

async function api(action, payload){
  const body=JSON.stringify(Object.assign({action}, payload||{}));
  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
  return await res.json();
}

function setSync(ok){ const el=document.getElementById('syncDot'); if(!el) return;
  el.textContent = ok?'● Saved':'● Save failed'; el.style.color = ok?'var(--good)':'#b14040'; }

/* debounced save — cloud when authed, else local preview */
let saveTimer=null;
function save(){
  if(API_URL && TOKEN){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{ api('save',{token:TOKEN,data:{state:STATE,uid:UID}})
      .then(r=>setSync(r&&r.ok)).catch(()=>setSync(false)); }, 600);
  } else { try{ localStorage.setItem('isha_local',JSON.stringify({state:STATE,uid:UID})); }catch(e){} }
}

function authUI(authed){
  const lb=document.getElementById('logoutBtn'), who=document.getElementById('whoami'), sd=document.getElementById('syncDot');
  const admBtn=document.getElementById('adminNavBtn');
  lb.style.display = authed?'':'none';
  who.style.display = authed?'':'none';
  sd.style.display  = authed?'':'none';
  if(admBtn) admBtn.style.display = (authed && IS_ADMIN) ? '' : 'none';
  if(authed){ who.textContent='Hi, '+(UNAME||'').split(' ')[0]+(IS_ADMIN?' · admin':''); setSync(true); }
}

/* ---- SETUP: paste the deployed /exec URL ---- */
function showSetup(){
  showGate(`<div class="glogo">${LOGO}</div><h2>Isha Karnataka</h2>
    <p class="gsub">One-time setup — connect your Google Sheet backend.</p>
    <label class="fld"><span>Web app URL (ends in /exec)</span>
      <input id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec" value="${API_URL.replace(/"/g,'&quot;')}"/></label>
    <div id="gerr" class="gerr"></div>
    <button class="btn" style="width:100%" onclick="testSetup()">Connect</button>
    <div class="grow"><a onclick="previewLocal()">Preview without backend →</a></div>`);
}
async function testSetup(){
  const url=document.getElementById('apiUrl').value.trim(), err=document.getElementById('gerr');
  if(!/^https:\/\/script\.google\.com\/.*\/exec$/.test(url)){ err.textContent='That doesn’t look like a /exec web-app URL.'; return; }
  err.textContent='Connecting…'; API_URL=url;
  try{ const r=await api('ping'); if(r&&r.ok){ try{localStorage.setItem('isha_api',url);}catch(e){} showLogin(); }
       else err.textContent='Reached it, but got an unexpected reply. Re-check the deployment.'; }
  catch(e){ err.textContent='Couldn’t reach the web app. Make sure access is set to “Anyone” and redeploy.'; }
}

/* ---- LOGIN (per-user) ---- */
function showLogin(){
  showGate(`<div class="glogo">${LOGO}</div><h2>Isha Karnataka</h2>
    <p class="gsub">Sign in to continue.</p>
    <label class="fld"><span>Username</span><input id="lu" autocomplete="username"/></label>
    <label class="fld"><span>Password</span><input id="lp" type="password" autocomplete="current-password"/></label>
    <div id="gerr" class="gerr"></div>
    <button class="btn" style="width:100%" onclick="doLogin()">Log in</button>
    <div class="grow"><a onclick="showSignup()">Create account</a></div>`);
  setTimeout(()=>{ const e=document.getElementById('lp'); if(e) e.addEventListener('keydown',ev=>{ if(ev.key==='Enter') doLogin(); }); },0);
}
async function doLogin(){
  const u=document.getElementById('lu').value.trim(), p=document.getElementById('lp').value, err=document.getElementById('gerr');
  err.textContent='Signing in…';
  try{ const r=await api('login',{username:u,password:p});
    if(r&&r.ok){
      TOKEN=r.token; UNAME=r.name||u; IS_ADMIN=!!r.admin;
      try{ localStorage.setItem('isha_token',TOKEN); localStorage.setItem('isha_name',UNAME); localStorage.setItem('isha_admin',IS_ADMIN?'1':'0'); }catch(e){}
      await afterAuth();
    } else err.textContent=(r&&r.error)||'Login failed.'; }
  catch(e){ err.textContent='Network error reaching the backend.'; }
}
async function doLogout(){
  try{ if(TOKEN) await api('logout',{token:TOKEN}); }catch(e){}
  TOKEN=''; UNAME=''; IS_ADMIN=false;
  try{ localStorage.removeItem('isha_token'); localStorage.removeItem('isha_name'); localStorage.removeItem('isha_admin'); }catch(e){}
  authUI(false); showLogin();
}

async function afterAuth(){
  try{
    const r=await api('load',{token:TOKEN});
    if(!r||!r.ok){ await doLogout(); return; }
    if(r.data && r.data.state){ for(const k in STATE) delete STATE[k]; Object.assign(STATE, r.data.state); UID=r.data.uid||UID; }
    else { await api('save',{token:TOKEN,data:{state:STATE,uid:UID}}); } // first run: seed the Sheet
  }catch(e){ /* keep built-in seed if load fails */ }
  authUI(true); hideGate(); render();
}

function previewLocal(){
  API_URL=''; TOKEN='';
  try{ const r=localStorage.getItem('isha_local'); if(r){ const o=JSON.parse(r); if(o&&o.state){ for(const k in STATE) delete STATE[k]; Object.assign(STATE,o.state); UID=o.uid||UID; } } }catch(e){}
  authUI(false); hideGate(); render();
}

/* nav + boot */
function showSignup(){
  showGate(`<div class="glogo">${LOGO}</div><h2>Isha Karnataka</h2>
    <p class="gsub">Create your account. An admin will approve access before you can log in.</p>
    <label class="fld"><span>Full name</span><input id="sn"/></label>
    <label class="fld"><span>Username</span><input id="su" autocomplete="username"/></label>
    <label class="fld"><span>Password</span><input id="sp" type="password" autocomplete="new-password"/></label>
    <div id="gerr" class="gerr"></div>
    <button class="btn" style="width:100%" onclick="doSignup()">Create account</button>
    <div class="grow"><a onclick="showLogin()">Back to login</a></div>`);
}
async function doSignup(){
  const n = document.getElementById('sn').value.trim();
  const u = document.getElementById('su').value.trim();
  const p = document.getElementById('sp').value;
  const err = document.getElementById('gerr');
  if(!u || !p){ err.textContent = 'Username and password required.'; return; }
  err.textContent = 'Creating account…';
  try {
    const r = await api('signup', {username:u, password:p, name:n});
    if(r && r.ok){
      // Pending-approval flow: do NOT auto-login. Show a confirmation screen.
      showGate(`<div class="glogo">${LOGO}</div>
        <h2>Account requested</h2>
        <p class="gsub">Thanks${n?', '+n.split(' ')[0]:''}. Your account <b>${u}</b> has been created and is now waiting for an admin to approve access. You'll be able to log in once that's done.</p>
        <button class="btn" style="width:100%" onclick="showLogin()">Back to login</button>`);
    } else {
      err.textContent = (r && r.error) || 'Signup failed.';
    }
  } catch(e){
    err.textContent = 'Network error reaching the backend.';
  }
}
document.getElementById('logoutBtn').onclick=doLogout;
async function boot(){
  showGate('<p class="gsub" style="margin:34px 0">Loading…</p>');
  if(!API_URL){ showSetup(); return; }
  if(!TOKEN){ showLogin(); return; }
  await afterAuth();
}
boot();
</script>
